services:
  - type: web
    name: uluka-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt && npm install --no-audit --no-fund && npm run build"
    startCommand: "cd server && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.8.1
